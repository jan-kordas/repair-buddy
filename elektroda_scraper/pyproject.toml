[project]
name = "elektroda-scraper"
version = "0.1.0"
description = "Elektroda.pl forum scraper for repair-buddy"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "requests>=2.32",
    "lxml>=5.0",
    "pydantic>=2.0",
    "selenium>=4.44.0",
]

[dependency-groups]
dev = [
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
