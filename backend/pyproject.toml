[project]
name = "repair-buddy-backend"
version = "0.1.0"
description = "Backend for repair-buddy mechanic assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "qdrant-client",
    "langchain",
    "langgraph",
    "pydantic-settings",
    "httpx",
    "pymupdf",
    "tqdm",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "psycopg[binary]",
    "alembic"
]

[dependency-groups]
dev = [
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
